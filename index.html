<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Do You Help? | Genshin NPC Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12162b;--card:#1d2342;--ink:#f2ecde;--muted:#aab0cc;--accent:#7fd3c8;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;min-height:100vh;padding:24px 16px 16px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);text-align:center;margin:0 0 20px;color:var(--muted)}
.layout{flex:1;display:flex;gap:28px;align-items:flex-start;justify-content:center;max-width:960px;width:100%;margin:0 auto}
.center{flex:1;min-width:0;max-width:640px;align-self:center}
main{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;width:100%}
#done{text-align:center;padding:40px 16px}
#done h2{font-size:2rem;margin-bottom:12px}
#done p{color:var(--muted);margin:0 0 20px}
#done button{all:unset;cursor:pointer;background:var(--accent);color:#0d1124;font-weight:600;padding:10px 22px;border-radius:999px}
#done button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
aside{width:200px;flex:none;background:var(--card);border-radius:14px;padding:14px 16px;align-self:flex-start}
aside h3{font-family:var(--serif);font-size:1.3rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
#count{color:var(--accent);font-family:var(--sans);font-size:.85rem}
#list{margin:0;padding:0;list-style:none;max-height:65vh;overflow-y:auto;font-size:.85rem;color:var(--muted);line-height:1.6}
#list li{padding:2px 0;border-top:1px solid rgba(255,255,255,.06)}
#list li:first-child{border-top:0;color:var(--ink)}
#list .none{font-style:italic}
.vs{font-family:var(--serif);font-size:1.3rem;color:var(--accent)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:2px solid transparent;
  border-radius:14px;overflow:hidden;text-align:center;
  transition:filter .4s,opacity .8s .3s,transform .3s,border-color .2s,box-shadow .3s}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card:disabled{cursor:default}
.card.survived{border-color:#4ade80;animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{box-shadow:0 0 0 rgba(74,222,128,0)}25%{box-shadow:0 0 38px rgba(74,222,128,.85);background:#245a40}100%{box-shadow:0 0 22px rgba(74,222,128,.45);background:#1f4a35}}
.card.faded{filter:grayscale(1) brightness(.55);opacity:0}
.pic{aspect-ratio:1/1;background:#0d1124;position:relative;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pic .ph{font-family:var(--serif);font-size:4rem;color:var(--muted);opacity:.6}
.info{padding:12px 14px 16px}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.05;margin:0 0 3px}
.region{color:var(--accent);font-size:.8rem;margin-bottom:8px}
.desc{color:var(--muted);font-size:.82rem;line-height:1.45;margin:0;max-width:30ch;margin-inline:auto}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px;line-height:1.5}
footer a{color:var(--muted)}
#err{text-align:center;color:#f2a7a7;grid-column:1/-1}
@media(max-width:720px){.layout{flex-direction:column;align-items:center;gap:16px}.center{max-width:360px;width:100%}
  main{grid-template-columns:1fr;gap:8px}.vs{text-align:center}
  .pic{aspect-ratio:16/10}.desc{max-width:none}aside{width:100%;max-width:360px}#list{max-height:200px}}
@media(prefers-reduced-motion:reduce){.card,.card.faded{transition:none}.card.survived{animation:none;background:#1f4a35}}
</style>
</head>
<body>
<h1>Who do you help in the battle?</h1>
<div class="layout"><div class="center">
<main id="stage" aria-live="polite">
  <button class="card" id="c0"><div class="pic"></div><div class="info"><h2></h2><div class="region"></div><p class="desc"></p></div></button>
  <div class="vs" aria-hidden="true">vs</div>
  <button class="card" id="c1"><div class="pic"></div><div class="info"><h2></h2><div class="region"></div><p class="desc"></p></div></button>
</main>
<div id="done" hidden><h2>That's every NPC</h2><p>Everyone has been shown once.</p><button id="again">Play again</button></div>
</div>
<aside aria-label="Casualties"><h3>Casualties <span id="count">0</span></h3><ol id="list"><li class="none">No one yet.</li></ol></aside>
</div>
<footer>
  Fan project, not affiliated with HoYoverse. Genshin Impact and its artwork belong to HoYoverse.<br>
  Images are loaded from the <a href="https://genshin-impact.fandom.com" target="_blank" rel="noopener">Genshin Impact Wiki</a> (text under CC BY-SA).
</footer>
<script>
const API="https://genshin-impact.fandom.com/api.php";
const cards=[document.getElementById("c0"),document.getElementById("c1")];
let npcs=[],deck=[],busy=false,current=[],upcoming=null,fallen=[];
const imgCache=new Map();
// Chance of dying (when NOT the one you picked), by Power Level. Chosen characters always survive.
const DEATH={Civilian:1,Medium:.66,Elite:.33,Epic:.05};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Deal without replacement: every NPC appears exactly once per game. Returns null when fewer than 2 remain.
function draw(){return deck.length<2?null:[deck.pop(),deck.pop()]}
function renderFallen(){
  document.getElementById("count").textContent=fallen.length;
  const ol=document.getElementById("list");ol.textContent="";
  if(!fallen.length){const li=document.createElement("li");li.className="none";li.textContent="No one yet.";ol.appendChild(li);return}
  fallen.forEach(n=>{const li=document.createElement("li");li.textContent=n;ol.appendChild(li)});
}
// Reads the infobox image straight from the wiki page's intro HTML (more reliable than the wiki's "page image" field).
async function parseImage(title){
  const url=`${API}?action=parse&format=json&origin=*&redirects=1&prop=text&section=0&disabletoc=1&page=${encodeURIComponent(title)}`;
  const d=await (await fetch(url)).json();
  if(!d.parse)return null;
  const doc=new DOMParser().parseFromString(d.parse.text["*"],"text/html");
  const img=doc.querySelector(".pi-image img")||doc.querySelector("figure img");
  if(!img)return null;
  const src=img.getAttribute("data-src")||img.getAttribute("src");
  if(!src||src.startsWith("data:"))return null;
  return src.replace(/\/revision\/latest(\/scale-to-width-down\/\d+)?/,"/revision/latest/scale-to-width-down/600");
}
async function findImage(n){
  try{const s=await parseImage(n.wiki||n.name);if(s)return s}catch(e){}
  try{ // fallback: search the wiki for the closest page title
    const q=`${API}?action=query&format=json&origin=*&list=search&srlimit=1&srsearch=${encodeURIComponent(n.name+" Genshin")}`;
    const r=await (await fetch(q)).json();const t=r.query.search[0]&&r.query.search[0].title;
    if(t)return await parseImage(t);
  }catch(e){}
  return null;
}
function getImage(n){
  if(!imgCache.has(n.name))imgCache.set(n.name,findImage(n));
  return imgCache.get(n.name);
}
function fill(card,n,src){
  card.querySelector("h2").textContent=n.name;
  card.querySelector(".region").textContent=n.region;
  card.querySelector(".desc").textContent=n.description;
  const pic=card.querySelector(".pic");pic.textContent="";
  if(src){const im=new Image();im.alt=n.name;im.referrerPolicy="no-referrer";im.src=src;im.onerror=()=>placeholder(pic,n);pic.appendChild(im)}
  else placeholder(pic,n);
}
function placeholder(pic,n){pic.textContent="";const s=document.createElement("span");s.className="ph";s.textContent=n.name[0];pic.appendChild(s)}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}

async function show(pair){
  const srcs=await Promise.all(pair.map(n=>withTimeout(getImage(n),5000)));
  current=pair;
  cards.forEach((c,i)=>{c.className="card";c.disabled=false;fill(c,pair[i],srcs[i])});
  upcoming=draw();if(upcoming)upcoming.forEach(getImage); // prefetch next pair's images
  busy=false;
}
function pick(i){
  if(busy)return;busy=true;
  cards.forEach(c=>c.disabled=true);
  cards[i].classList.add("survived");
  const other=current[1-i];
  if(Math.random()<(DEATH[other.power]??1)){ // the unchosen one dies: gray fade + casualty list (newest on top)
    cards[1-i].classList.add("faded");fallen.unshift(other.name);renderFallen();
  }else cards[1-i].classList.add("survived"); // lucky: flashes green like the chosen one
  setTimeout(()=>{if(upcoming)show(upcoming);else finish()},1100); // let the other card fade, then jump straight to the next pair
}
cards.forEach((c,i)=>c.addEventListener("click",()=>pick(i)));
function finish(){document.getElementById("stage").hidden=true;document.getElementById("done").hidden=false;document.getElementById("again").focus()}
function start(){
  fallen=[];renderFallen();deck=shuffle(npcs.slice());
  document.getElementById("done").hidden=true;document.getElementById("stage").hidden=false;
  show(draw());
}
document.getElementById("again").addEventListener("click",start);

fetch("npcs.json").then(r=>r.json()).then(d=>{npcs=d;start()}).catch(()=>{
  document.getElementById("stage").innerHTML='<p id="err">Could not load npcs.json. Open this page through GitHub Pages or a local server, not by double-clicking the file.</p>';
});
</script>
</body>
</html>
