<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Do You Help? | Genshin NPC Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12162b;--card:#1d2342;--ink:#f2ecde;--muted:#aab0cc;--accent:#7fd3c8;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{display:flex;flex-direction:column;min-height:100vh;padding:24px 16px 16px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);text-align:center;margin:0 0 20px;color:var(--muted)}
main{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;max-width:1100px;width:100%;margin:0 auto}
.vs{font-family:var(--serif);font-size:1.6rem;color:var(--accent)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:2px solid transparent;
  border-radius:14px;overflow:hidden;text-align:center;
  transition:filter .4s,opacity .8s .3s,transform .3s,border-color .2s,box-shadow .3s}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card:disabled{cursor:default}
.card.picked{border-color:var(--accent);box-shadow:0 0 28px rgba(127,211,200,.35)}
.card.faded{filter:grayscale(1) brightness(.55);opacity:0}
.card.hidden{opacity:0;transition:none}
.card.leaving{opacity:0;transition:opacity .5s}
.pic{aspect-ratio:1/1;background:#0d1124;position:relative;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pic .ph{font-family:var(--serif);font-size:6rem;color:var(--muted);opacity:.6}
.info{padding:18px 20px 22px}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,4.5vw,3rem);line-height:1.05;margin:0 0 4px}
.region{color:var(--accent);font-size:.9rem;margin-bottom:10px}
.desc{color:var(--muted);font-size:.95rem;line-height:1.5;margin:0;max-width:34ch;margin-inline:auto}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px;line-height:1.5}
footer a{color:var(--muted)}
#err{text-align:center;color:#f2a7a7;grid-column:1/-1}
@media(max-width:720px){main{grid-template-columns:1fr;gap:12px}.vs{text-align:center}
  .pic{aspect-ratio:16/10}.desc{max-width:none}}
@media(prefers-reduced-motion:reduce){.card,.card.faded{transition:none}}
</style>
</head>
<body>
<h1>Who do you help in the battle?</h1>
<main id="stage" aria-live="polite">
  <button class="card hidden" id="c0"><div class="pic"></div><div class="info"><h2></h2><div class="region"></div><p class="desc"></p></div></button>
  <div class="vs" aria-hidden="true">vs</div>
  <button class="card hidden" id="c1"><div class="pic"></div><div class="info"><h2></h2><div class="region"></div><p class="desc"></p></div></button>
</main>
<footer>
  Fan project, not affiliated with HoYoverse. Genshin Impact and its artwork belong to HoYoverse.<br>
  Images are loaded from the <a href="https://genshin-impact.fandom.com" target="_blank" rel="noopener">Genshin Impact Wiki</a> (text under CC BY-SA).
</footer>
<script>
const API="https://genshin-impact.fandom.com/api.php";
const cards=[document.getElementById("c0"),document.getElementById("c1")];
let npcs=[],deck=[],busy=false,current=[],upcoming=null;
const imgCache=new Map();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Deal without replacement. When the deck runs low, reshuffle everyone else and keep any leftover first.
function draw(){
  if(deck.length<2){const left=deck.slice();deck=shuffle(npcs.filter(n=>!left.includes(n))).concat(left)}
  return [deck.pop(),deck.pop()];
}
function getImage(n){
  if(!imgCache.has(n.name)){
    const url=`${API}?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=700&titles=${encodeURIComponent(n.wiki||n.name)}`;
    imgCache.set(n.name,fetch(url).then(r=>r.json()).then(d=>{
      const p=Object.values(d.query.pages)[0];return p&&p.thumbnail?p.thumbnail.source:null
    }).catch(()=>null));
  }
  return imgCache.get(n.name);
}
function fill(card,n,src){
  card.querySelector("h2").textContent=n.name;
  card.querySelector(".region").textContent=n.region;
  card.querySelector(".desc").textContent=n.description;
  const pic=card.querySelector(".pic");pic.textContent="";
  if(src){const im=new Image();im.alt=n.name;im.src=src;im.onerror=()=>placeholder(pic,n);pic.appendChild(im)}
  else placeholder(pic,n);
}
function placeholder(pic,n){pic.textContent="";const s=document.createElement("span");s.className="ph";s.textContent=n.name[0];pic.appendChild(s)}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}

async function show(pair){
  const srcs=await Promise.all(pair.map(n=>withTimeout(getImage(n),2500)));
  current=pair;
  cards.forEach((c,i)=>{c.className="card hidden";c.disabled=false;fill(c,pair[i],srcs[i])});
  requestAnimationFrame(()=>requestAnimationFrame(()=>cards.forEach(c=>{c.classList.remove("hidden");c.style.transition="opacity .6s"})));
  upcoming=draw();upcoming.forEach(getImage); // prefetch next pair's images
  busy=false;
}
function pick(i){
  if(busy)return;busy=true;
  cards.forEach(c=>c.disabled=true);
  cards[i].classList.add("picked");
  cards[1-i].classList.add("faded");
  setTimeout(()=>{
    cards.forEach(c=>c.classList.add("leaving"));
    setTimeout(()=>{cards.forEach(c=>c.removeAttribute("style"));show(upcoming)},550);
  },1300);
}
cards.forEach((c,i)=>c.addEventListener("click",()=>pick(i)));

fetch("npcs.json").then(r=>r.json()).then(d=>{npcs=d;show(draw())}).catch(()=>{
  document.getElementById("stage").innerHTML='<p id="err">Could not load npcs.json. Open this page through GitHub Pages or a local server, not by double-clicking the file.</p>';
});
</script>
</body>
</html>
